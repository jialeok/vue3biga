name = "bidding-auto-fetch"
main = "bidding-auto-fetch/index.js"
compatibility_date = "2025-07-29"

# 北京时间 9:25  = UTC 01:25（工作日 周一~周五 = Cloudflare 2-6）
# 北京时间 16:00 = UTC 08:00（工作日 周一~周五 = Cloudflare 2-6）→ 收盘涨幅覆盖
# ⚠️ Cloudflare 星期编号：1=周日, 2=周一, ..., 6=周五, 7=周六
#    工作日必须用 2-6，不能用 1-5（1-5 = 周日到周四，周五会漏掉！）
[triggers]
crons = ["25 1 * * 2-6", "0 8 * * 2-6"]

[vars]
TZ = "Asia/Shanghai"

# 敏感变量请通过 wrangler secret 设置：
#   wrangler secret put NUMCAT_API_KEY --config wrangler-bidding-auto-fetch.toml
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY --config wrangler-bidding-auto-fetch.toml
#   wrangler secret put SUPABASE_ANON_KEY --config wrangler-bidding-auto-fetch.toml
#   wrangler secret put FUYAO_API_KEY_HISTORY --config wrangler-bidding-auto-fetch.toml
#   wrangler secret put FETCH_TOKEN --config wrangler-bidding-auto-fetch.toml
#
# [KEY-FALLBACK 2026-09-28] 早盘 9:25 数据兜底：主账号额度用尽 → 自动退回【小号】。
#   用与「竞价一字」同一把小号（Supabase Secret 里叫 NUMCAT_API_KEY_YIZI），
#   ⛔ 不设这一条 = 兜底静默关闭（仍能跑，但主账号一被烧光当天就没数据）。
#   wrangler secret put NUMCAT_API_KEY_YIZI --config wrangler-bidding-auto-fetch.toml
#   次日 9:25 的 worker 日志第一行会回显 key 候选链，用它确认兜底是否已生效：
#     🔑 猫抓 key 候选链: NUMCAT_API_KEY(abcd***wxyz) → NUMCAT_API_KEY_YIZI(efgh***rstu)｜主账号额度用尽会自动退回小号
#
#   🆕 2026-09-28：小号额度已被【主动留出】——「竞价一字」看板每天最多只用 2 次
#     （Supabase Edge Function auction-yizi-fetch 的 Secret AUCTION_YIZI_DAILY_BUDGET=2），
#     其余 8 次全留给本 worker 的兜底（早盘 daily_auc + daily 两腿，收盘腿同理）。
#     ⇒ 只要不动那个 Secret，兜底链就恒有小号额度可用。
#     自检：GET <SUPABASE_URL>/functions/v1/auction-yizi-fetch/health → dailyBudget.leftToday
