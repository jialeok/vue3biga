name = "bidding-auto-fetch"
main = "bidding-auto-fetch/index.js"
compatibility_date = "2025-07-29"

# 鍖椾含鏃堕棿 9:25 = UTC 01:25锛堝伐浣滄棩鍛ㄤ竴鍒板懆浜?= 2-6锛?# 鍖椾含鏃堕棿 16:00 = UTC 08:00锛堝伐浣滄棩鍛ㄤ竴鍒板懆浜?= 2-6锛?# 鈿狅笍 Cloudflare 鏄熸湡缂栧彿锛?=鍛ㄦ棩, 2=鍛ㄤ竴, ..., 6=鍛ㄤ簲, 7=鍛ㄥ叚
#    宸ヤ綔鏃ュ繀椤荤敤 2-6锛屼笉鑳界敤 1-5锛?-5 = 鍛ㄦ棩鍒板懆鍥涳紝鍛ㄤ簲浼氭紡鎺夛紒锛?[triggers]
crons = ["25 1 * * 2-6"]

[vars]
TZ = "Asia/Shanghai"

