name = "bidding-auto-fetch"
main = "bidding-auto-fetch/index.js"
compatibility_date = "2025-07-29"

# 北京时间 9:25  = UTC 01:25（工作日 周一~周五 = Cloudflare 2-6）→ 早盘主流程
# 北京时间 9:26  = UTC 01:26（工作日 周一~周五 = Cloudflare 2-6）→ [LADDER26 2026-11-06]
#    「最近多板 883410」名单源二次确认 + 新进成分股猫抓补竞价量比。
#    11-06 P0：9:25 上游 Data source unavailable、9:4x 就恢复，只靠 9:25 内重试救不回来。
#    9:25 已写足量真实名单时这一趟 0 上游请求、0 猫抓额度，幂等跳过。
# 北京时间 9:27  = UTC 01:27（工作日 周一~周五 = Cloudflare 2-6）→ [CLOUD-0927-HEAL 2026-11-11]
#    ★ 用户硬口径：「最迟 9:27，我一直要求的是竞价期间」「全部在云端跑，我早上只用手机看网页」。
#    此前 index.js 里早有 '27 1' → snapshot 映射、range-heal.js 也早已实现，但**本文件没挂 cron**
#    ⇒ 9:25 猫抓 daily 超时 / 9:26 抢跑时，当天区间涨幅只能等有人打开网页触发前端自愈。
#    这一趟补三件事，全部幂等、只填空、正常日 0 额外猫抓额度：
#      ① 同花顺快照补当日竞价字段（免费，⛔ 不含量比）；
#      ② runRangePctHeal 补 stock_range_pct（覆盖率≥80% 零请求，否则 1 次猫抓 daily）；
#      ③ runRange20Prefill 再补一次 20 日涨幅（0 上游、0 额度）⇒ 修 9:25/9:26 时序竞争。
# 北京时间 16:00 = UTC 08:00（工作日 周一~周五 = Cloudflare 2-6）→ 收盘涨幅覆盖
# ⚠️ Cloudflare 星期编号：1=周日, 2=周一, ..., 6=周五, 7=周六
#    工作日必须用 2-6，不能用 1-5（1-5 = 周日到周四，周五会漏掉！）
# 北京时间 16:03 = UTC 08:03（工作日 2-6）→ [CLOSE-POST 2026-11-13] 收盘后补写轮
#    ★★ 事故根因（生产日志取证，11-13 手动 point=close）：Cloudflare 免费版
#      **单次 Worker invocation 上限 50 次 subrequest**。11-07 起陆续把
#      「竞价看板收盘列 / 记忘昨收盘 / 总龙分歧收盘腿」塞进 16:00 那一轮，
#      到「指数快照」那一步就爆 `Too many subrequests by single Worker invocation`：
#      收盘列写不进 bidding_data.close、记忘 / LD 也全灭，连 persistRunResult 都发不出去
#      ⇒ 收盘列全空、11-09 起连 close 运行日志都消失（用户报障「已经两天了」）。
#    ⇒ 拆成两次【独立 invocation】，每次各有自己的 50 次额度：
#      16:00 close     = 收盘涨幅覆盖 + 竞价字段补漏 + 逐日腿 + 运行日志；
#      16:03 closepost = 收盘列 + 记忘 + 总龙分歧收盘腿 + 运行日志。
#    ⚠️ 三项都幂等、只填空；16:03 时 16:00 那轮的收盘腿已落库（实测主轮约 18s）。
# ⚠️ 免费账户 5 条 cron，本次起【用满 5 条】；Supabase pg_cron 不占这个额度。
#    ⛔ 再加新时间点前必须先删一条或升级套餐，别把已有 5 条挤掉。
[triggers]
crons = ["25 1 * * 2-6", "26 1 * * 2-6", "27 1 * * 2-6", "0 8 * * 2-6", "3 8 * * 2-6"]

[vars]
TZ = "Asia/Shanghai"

# 敏感变量请通过 wrangler secret 设置：
#   wrangler secret put NUMCAT_API_KEY --config wrangler-bidding-auto-fetch.toml
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY --config wrangler-bidding-auto-fetch.toml
#   wrangler secret put SUPABASE_ANON_KEY --config wrangler-bidding-auto-fetch.toml
#   wrangler secret put FUYAO_API_KEY_HISTORY --config wrangler-bidding-auto-fetch.toml
#   wrangler secret put FETCH_TOKEN --config wrangler-bidding-auto-fetch.toml
#
# [KEY-FALLBACK 2026-09-28] 早盘 9:25 数据兜底：主账号额度用尽 → 自动退回【小号】。
#   用与「竞价一字」同一把小号（Supabase Secret 里叫 NUMCAT_API_KEY_YIZI），
#   ⛔ 不设这一条 = 兜底静默关闭（仍能跑，但主账号一被烧光当天就没数据）。
#   wrangler secret put NUMCAT_API_KEY_YIZI --config wrangler-bidding-auto-fetch.toml
#   次日 9:25 的 worker 日志第一行会回显 key 候选链，用它确认兜底是否已生效：
#     🔑 猫抓 key 候选链: NUMCAT_API_KEY(abcd***wxyz) → NUMCAT_API_KEY_YIZI(efgh***rstu)｜主账号额度用尽会自动退回小号
#
#   🆕 2026-09-28：小号额度已被【主动留出】——「竞价一字」看板每天最多只用 2 次
#     （Supabase Edge Function auction-yizi-fetch 的 Secret AUCTION_YIZI_DAILY_BUDGET=2），
#     其余 8 次全留给本 worker 的兜底（早盘 daily_auc + daily 两腿，收盘腿同理）。
#     ⇒ 只要不动那个 Secret，兜底链就恒有小号额度可用。
#     自检：GET <SUPABASE_URL>/functions/v1/auction-yizi-fetch/health → dailyBudget.leftToday
