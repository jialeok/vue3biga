# [JIWANG-SHOUGU-CLOUD 2026-11-08] Worker 手动回补的纯云端入口
#   背景：本机 DNS 对 *.workers.dev 有污染，且 FETCH_TOKEN 是 Cloudflare Secret（只写不可读），
#        所以过去「立即回补」只能靠人手在 Dashboard / 浏览器里点。
#   本工作流把这一步搬到 GitHub Actions：Actions 的网络可直达 workers.dev，
#   令牌放在仓库 Secret，用户在 Actions 页面点 Run workflow 即可，⛔ 不需要本机、不需要粘贴。
#   常用 point：
#     jiwang    → 回补 jiwang_data.shouguJieguo（10 日窗口，只填空、不覆盖人工修正）
#     closepost → [CLOSE-POST 2026-11-13] 立即补写当天竞价看板「收盘」列 + 记忘（独立 invocation）
#     ladder26  → 「最近多板 883410」名单二次确认
#     range20   → 20 日涨幅补位
#     extras    → 竞价四要素补漏
name: Worker 云端手动回补

on:
  workflow_dispatch:
    inputs:
      point:
        description: 'point: jiwang | closepost | ladder26 | range20 | range30 | extras | morning | close | snapshot | ladder'
        required: true
        default: 'jiwang'
      dates:
        # ★★ [LEGS/R30-CLOUD 2026-11-20] 历史日批量回补：逗号分隔的 YYYY-MM-DD。
        #   每次【单独一次 Worker invocation】(各有 50 次 subrequest 配额)，⛔ 不在本机跑。
        #   例：2026-11-17,2026-11-18,2026-11-19,2026-11-20
        description: '可选：历史日列表（逗号分隔），逐日逐点回补，留空=只跑今天'
        required: false
        default: ''
      endAtDate:
        description: '历史回补 30 日涨幅时：1=窗口末日取指定日当天（收盘口径，推荐）'
        required: false
        default: ''
      confirm:
        description: '填 YES 才会真正执行'
        required: true
        default: 'YES'
      overwrite:
        # [OVERWRITE 2026-11-13] 只给 closepost 用：允许改写「已有非空」的收盘值。
        #   场景：11-13 的 板块ETF 被旧逻辑写成 0（48 个标的没有一个上涨，物理不可能），
        #   正确值是 8；不改就永远冻着错值。默认留空 = 不覆盖，保持「人工修正优先」红线。
        description: '仅 closepost：填 1 = 允许覆盖已有收盘值（修错值用，平时留空）'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: 校验
        if: ${{ inputs.confirm != 'YES' }}
        run: |
          echo "::error::confirm 必须为 YES"
          exit 1

      - name: 触发 Worker
        env:
          TOKEN: ${{ secrets.WORKER_FETCH_TOKEN }}
          POINT: ${{ inputs.point }}
          OVERWRITE: ${{ inputs.overwrite }}
          DATES: ${{ inputs.dates }}
          ENDATDATE: ${{ inputs.endAtDate }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then
            echo "::error::仓库 Secret WORKER_FETCH_TOKEN 未设置"
            exit 1
          fi
          # 每个 (point, date) 各发一次 HTTP ⇒ 每次都是独立 Worker invocation、独立 50 次配额。
          # ⛔ 不能把多天塞进一次请求：Cloudflare 单次 invocation 的 subrequest 上限会把它们全废掉。
          IFS=',' read -ra DAY_LIST <<< "${DATES:-today}"
          for D in "${DAY_LIST[@]}"; do
            D="$(echo "$D" | xargs)"
            URL="https://bidding-auto-fetch.cctopid.workers.dev/fetch?point=${POINT}&token=${TOKEN}"
            if [ "$D" != "today" ]; then
              URL="${URL}&date=${D}"
              echo "=== ${POINT} 历史回补 ${D} ==="
              case "${POINT}" in
                range30) URL="${URL}&overwrite=1&endAtDate=${ENDATDATE:-1}" ;;
                range20) URL="${URL}&overwrite=1" ;;
              esac
            else
              echo "=== ${POINT} 当天 ==="
              if [ "${OVERWRITE}" = "1" ]; then URL="${URL}&overwrite=1"; fi
            fi
            echo "触发 ${URL%%&token=*}…"
            code="$(curl -sS -o /tmp/worker-resp.json -w '%{http_code}' --max-time 180 "$URL")"
            echo "HTTP ${code}"
            cat /tmp/worker-resp.json
            echo
            if [ "$code" != "200" ]; then
              echo "::error::Worker 返回非 200 ⇒ 视为失败，不允许假绿"
              exit 1
            fi
            node -e '
              const fs = require("fs");
              const j = JSON.parse(fs.readFileSync("/tmp/worker-resp.json", "utf8"));
              if (j.ok !== true) { console.error("Worker 业务失败: " + JSON.stringify(j)); process.exit(1); }
              console.log("Worker 业务成功: written=" + (j.written ?? "n/a"));
              (j.logs || []).forEach(l => console.log("  " + l));
            '
          done
