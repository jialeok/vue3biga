# Supabase 云端自愈（逐日腿 / 20日涨幅 / 10日涨幅 / 猫抓竞价量比历史回填）
#
# [CLOUD-ONLY 2026-11-06 用户口径] 「本机的那些一律迁移到云端」
#   本机 WorkBuddy 自动化「20日涨幅 · 逐日腿每日补齐（工作日 08:00）」已停用：
#     · 逐日腿改由 Cloudflare Worker 的 16:00 close / 09:26 ladder26 两趟补齐
#       （workers/bidding-auto-fetch/logic/daily-legs-heal.js，wrangler CI 自动部署）；
#     · 20 日涨幅改由 09:26 的 range20-prefill.js 云端补缺；
#     · 本 workflow 负责 Edge 侧剩下的「历史日回填 + 结果表补算」，每天两次。
#
# 为什么用 GitHub Actions 而不是只靠 Supabase pg_cron：
#   · 不需要 SUPABASE_DB_URL / Supabase CLI / Access Token，一次 HTTP POST 即可；
#   · pg_cron 一旦被误 unschedule 或 JWT 过期，这里仍有一层独立兜底；
#   · 两端都是幂等（只补缺、不覆盖），同时跑不会互相破坏。
#
# ⚠️ 时间是 UTC：08:30 = 北京 16:30、00:50 = 北京 08:50；1-5 = 周一~周五。
# ⚠️ 16:30 那一轮才会触发猫抓历史回填（Edge 内部 hhmm >= '15:05' 闸），
#    08:50 那轮只做 0 上游请求的腿/结果表补算 ⇒ 每天猫抓额度恒 1 次。

name: Supabase 云端自愈（工作日 08:50 / 16:30 北京）

on:
  schedule:
    - cron: '50 0 * * 1-5'
    - cron: '30 8 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: '可选：指定回补日期 YYYY-MM-DD（留空=今天）'
        required: false
        default: ''

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 调用 range20-precompute?healOnly=1
        env:
          # anon public key 与 ?token= 均已公开在 db/create_range20_legs_cron.sql / SQL 文件里，
          # 属于前端公开钥匙，不是机密；如需收紧可改成 secrets.SUPABASE_ANON_KEY。
          EDGE_URL: https://tonqfgeyxnnwicjopshn.supabase.co/functions/v1/range20-precompute
          ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRvbnFmZ2V5eG5ud2ljam9wc2huIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NjY3NzEsImV4cCI6MjA5NDI0Mjc3MX0.el-W10JIjr9iQXEKNxV7nLNdhZfOQp6waTY7ZSH27Jg
          EDGE_TOKEN: range20-cron-2026
          TARGET_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          URL="${EDGE_URL}?token=${EDGE_TOKEN}&healOnly=1"
          if [ -n "${TARGET_DATE}" ]; then URL="${URL}&date=${TARGET_DATE}"; fi
          echo "POST ${EDGE_URL}?token=***&healOnly=1 (date=${TARGET_DATE:-今天})"
          BODY=$(curl -sS -X POST "${URL}" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            -H 'Content-Type: application/json' \
            -d '{}' --max-time 180 -w '\n%{http_code}')
          CODE=$(printf '%s' "${BODY}" | tail -n1)
          JSON=$(printf '%s' "${BODY}" | sed '$d')
          echo "HTTP ${CODE}"
          printf '%s\n' "${JSON}" | head -c 4000
          if [ "${CODE}" != "200" ]; then
            echo "::error::云端自愈返回 HTTP ${CODE}"
            exit 1
          fi
          # [HEAL-PARSE 2026-11-06] 原来用 grep -q '"ok":true' 判成功，
          #   这依赖 Edge 恰好输出紧凑 JSON；一旦改成格式化输出（"ok": true）就会「假红」。
          #   实测 2026-11-06 Edge 返回紧凑 JSON（ok:true）/ HTTP 200 / 21.4s，
          #   但判据必须是结构化的：解析 JSON 后判 j.ok === true，顺带把 errors 打进日志。
          printf '%s' "${JSON}" > /tmp/heal.json
          node -e '
            const fs = require("node:fs");
            const raw = fs.readFileSync("/tmp/heal.json", "utf8");
            let j;
            try { j = JSON.parse(raw); }
            catch (e) {
              console.error("::error::云端自愈返回非 JSON: " + raw.slice(0, 300));
              process.exit(1);
            }
            if (j.ok !== true) {
              console.error("::error::云端自愈未返回 ok:true，errors=" + JSON.stringify(j.errors || []));
              process.exit(1);
            }
            console.log("✅ 云端自愈成功 today=" + j.today + " errors=" + JSON.stringify(j.errors || []));
          '

      # ★★ [JIWANG-SLOT 2026-11-13] 记忘「昨收盘结果（跌:涨）」兜底 —— 08:50 北京这一轮。
      #   主路径在 Cloudflare 16:00 close 轮的【第一个动作】（workers/bidding-auto-fetch/index.js
      #   的 JIWANG-SLOT 注释）：数据库取证证明 16:00 那跑是成功的，16:03 再要就被额度拒了。
      #   这里 08:50 是第二道：猫抓额度北京 0 点已重置 ⇒ 一定能取到，保证当天 9:15 开盘前
      #   `jiwang_data[今天].shouguJieguo` 一定有值（否则记忘看板的「昨收盘结果」整列空）。
      #   ⚠️ 两处都幂等（只填空、已有非空值绝不覆盖），重复跑无副作用。
      #   ⚠️ 16:30 那轮【不跑】记忘：会和当天 16:00 抢同一份额度，且必然已被用完。
      - name: 08:50 轮 · 记忘昨收盘结果（point=jiwang）
        if: ${{ github.event_name != 'schedule' || github.event.schedule == '50 0 * * 1-5' }}
        env:
          TOKEN: ${{ secrets.WORKER_FETCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then
            echo "::error::仓库 Secret WORKER_FETCH_TOKEN 未设置"
            exit 1
          fi
          URL="https://bidding-auto-fetch.cctopid.workers.dev/fetch?point=jiwang&token=${TOKEN}"
          echo "触发 记忘昨收盘结果（独立 invocation）"
          code="$(curl -sS -o /tmp/jiwang.json -w '%{http_code}' --max-time 180 "$URL")"
          echo "HTTP ${code}"
          cat /tmp/jiwang.json
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Worker 返回非 200 ⇒ 视为失败，不允许假绿"
            exit 1
          fi
          node -e '
            const fs = require("node:fs");
            const j = JSON.parse(fs.readFileSync("/tmp/jiwang.json", "utf8"));
            // ⛔ 不拿 ok 验收：ok=true + written=0 是「本来就齐了」，不是失败；
            //    但 ok=false 必须红（额度用尽 / 上游挂了，会直接导致记忘看板空一列）。
            if (j.ok !== true) {
              console.error("::error::记忘昨收盘结果失败: " + JSON.stringify(j).slice(0, 800));
              process.exit(1);
            }
            console.log("✅ 记忘昨收盘结果完成 written=" + (j.written ?? "n/a"));
            (j.logs || []).slice(-10).forEach(l => console.log("  " + l));
          '

      # ★★ [CLOSE-POST 2026-11-13] 第二十五条「总龙分歧」收盘腿 —— 独立 invocation。
      #   为什么挂在这里：16:00 close / 16:03 closepost 两轮都已接近 Cloudflare 免费版
      #   「单次 invocation 50 次 subrequest」上限；LD 一次要分页读 4 张表 × 20 天（约 30 页），
      #   塞进任一回都会报 Too many subrequests ⇒ 收盘腿永远算不出来（11-13 首轮实测）。
      #   ⇒ 借本 workflow 已有的 16:30 云端定时，单独发一次 HTTP 调 Worker（配额独立、关电脑也能用）。
      #   ⚠️ 08:50 那轮不跑（收盘腿还没落地）；workflow_dispatch 手动时也跑，方便立即验收。
      - name: 16:30 轮 · 总龙分歧收盘腿（point=divergedays&phase=close）
        if: ${{ github.event_name != 'schedule' || github.event.schedule == '30 8 * * 1-5' }}
        env:
          TOKEN: ${{ secrets.WORKER_FETCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then
            echo "::error::仓库 Secret WORKER_FETCH_TOKEN 未设置"
            exit 1
          fi
          URL="https://bidding-auto-fetch.cctopid.workers.dev/fetch?point=divergedays&days=1&phase=close&token=${TOKEN}"
          echo "触发 总龙分歧收盘腿（独立 invocation）"
          code="$(curl -sS -o /tmp/ldclose.json -w '%{http_code}' --max-time 180 "$URL")"
          echo "HTTP ${code}"
          cat /tmp/ldclose.json
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Worker 返回非 200 ⇒ 视为失败，不允许假绿"
            exit 1
          fi
          node -e '
            const fs = require("node:fs");
            const j = JSON.parse(fs.readFileSync("/tmp/ldclose.json", "utf8"));
            if (j.ok !== true) {
              console.error("::error::总龙分歧收盘腿业务失败: " + JSON.stringify(j).slice(0, 800));
              process.exit(1);
            }
            console.log("✅ 总龙分歧收盘腿完成 written=" + (j.written ?? "n/a") +
              " phase=" + (j.phase ?? "-"));
            (j.logs || []).slice(-12).forEach(l => console.log("  " + l));
          '
