name: Deploy Cloudflare Worker (bidding-auto-fetch)

# [WORKER-CI 2026-11-06] 目的：把「改完 worker 还要去 Cloudflare Dashboard 手动粘一遍」
# 这件事彻底取消。push 到 main 且碰到 worker 相关文件 ⇒ 自动测试 + 自动部署 + 线上复核。
#
# ⚠️ 一次性准备（在 GitHub 仓库里做一次就够）：
#   Settings → Secrets and variables → Actions → New repository secret
#     CLOUDFLARE_API_TOKEN   = 有 Workers Scripts:Edit + Read 权限的 API Token
#     CLOUDFLARE_ACCOUNT_ID  = 0ec12a103051054d51a92198fb98397b
#
# 🔴 部署会按下述 toml 的 [triggers] **完全覆盖线上 cron**。
#    workers/wrangler-bidding-auto-fetch.toml 里现在是 5 条（北京 09:25 / 09:26 / 09:27 / 16:00 / 16:03）：
#      25 1 * * 2-6  morning    早盘主流程
#      26 1 * * 2-6  ladder26   最近多板 883410 名单二次确认 + 猫抓补新进票 + 20 日涨幅补缺
#      27 1 * * 2-6  snapshot   竞价期间云端自愈（竞价字段 / 十日涨幅 / 20 日涨幅二次补缺）
#      0  8 * * 2-6  close      收盘覆盖 + 逐日腿云端补齐 + 运行日志
#      3  8 * * 2-6  closepost  [CLOSE-POST 2026-11-13] 收盘列 / 记忘 / 总龙分歧收盘腿 + 运行日志
#    ★ 16:03 这一条是修「收盘列全空」的：Cloudflare 单次 invocation 只有 50 次 subrequest，
#      补写任务塞在 16:00 主轮里会把配额顶爆，连日志都写不出去 ⇒ 必须拆成独立 invocation。
#    免费账户 5 条 cron，⛔ 已用满；Supabase pg_cron / GitHub Actions 不占这个额度。
#    ⛔ 改 cron 前必须先核线上，否则会把「7/30 断抓」那个根因再造一遍。
#
# ⛔ 不要加 paths 之外的全量触发：前端改动由 deploy-pages.yml 负责，两边各管各的。
#
# [FAKE-GREEN 2026-11-06] 事故与三道闸：
#   事故：wrangler@4.158.0 要求 Node >=22，CI 却在 Node 20 上跑；wrangler 打印
#         「requires at least Node.js v22」直接退出，但 `... | tee` 没有 pipefail，
#         tee 返回 0 ⇒ 三个 job 全绿，线上脚本一行没动（仍是 2 条 cron、无新函数）。
#   闸①：三个 job 统一 Node 22。
#   闸②：部署步骤 set -o pipefail + 断言日志里真有 "Current Version ID"。
#   闸③：部署后直接查 Cloudflare API，断言线上脚本含本轮新标识符、cron 与 toml 一致。
#   ⛔ 三道闸都不许用 continue-on-error / `|| true` 软化，否则假绿原样回归。

on:
  push:
    branches: [main]
    paths:
      - 'workers/bidding-auto-fetch/**'
      - 'src/logic/auction/range-window.js'          # worker 直接 import 的纯函数（跨目录引用）
      # [BIDDING-CLOSE-CLOUD 2026-11-07] worker 16:00 收盘列落库直接 import 这份共享口径。
      #   ⛔ 不列进 paths ⇒ 改了取值口径却不会重新部署 Worker，线上继续用旧算法（又一例假绿）。
      - 'src/logic/bidding/snapshot-spec.js'
      # ★ [LD-CLOUD 2026-11-13] 第二十五条「总龙分歧」云端预计算直接 import 下面这一整条纯函数链
      #   （反解 → 竞价口径榜 → 判定）。⛔ 不列进 paths ⇒ 改了判定口径 Worker 不会重新部署，
      #   线上继续用旧算法 —— 这正是本条注释上面说的「假绿」。新增 import 必须同步这里。
      - 'src/logic/auction/auction-leg-pct.js'
      - 'src/logic/auction/auction-leg-board.js'
      - 'src/logic/auction/range20-board-consts.js'
      - 'src/logic/auction/limit-up.js'
      - 'src/logic/auction/range-pct-sort.js'
      - 'src/logic/auction/presence-label.js'
      - 'src/logic/topicvolratio/leader-diverge.js'
      - 'src/logic/topicvolratio/tvrb-constants.js'
      - 'src/logic/topicvolratio/range10-backup.js'
      - 'src/logic/decision/auction-share.js'
      # [NUM-TEXT 2026-11-13] worker 侧数值解析（'+2.30%' 这种 DB 文本）走这份共享实现。
      #   ⛔ 不列进 paths ⇒ 修了解析口径 Worker 不会重新部署，线上继续 D1/D2 判不出来。
      - 'src/logic/util/num-text.js'
      - 'workers/wrangler-bidding-auto-fetch.toml'
      - 'workers/verify-deploy.mjs'
      # [FAKE-GREEN 2026-11-06] 本文件自身也纳入触发：改了部署流水线却没重新部署，
      #   等于把「CI 绿了但线上是旧代码」永久固化。首次新增 workflow 时用的是手动 dispatch。
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

concurrency:
  # 同一条流水线串行：两个部署任务并发会互相覆盖，必须排队
  group: worker-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Worker 单测（不通过就不部署）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # wrangler@4.158.0 要求 Node >=22，三个 job 必须统一，别再退回 20。
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # [CLOUD-0927-HEAL 2026-11-11] 单测覆盖不到 runMorning 主路径时，`no-undef`
      #   （例如完整性汇总里引用了 fetchAndWriteWatchlist 的局部变量）会一路溜到线上，
      #   9:25 整轮直接 ReferenceError ⛔ 一张表都不写。--quiet 只报 error，
      #   仓库里 1200+ 条历史 no-unused-vars warning 不阻断部署。
      - name: 静态检查（no-undef 等 error 必须为零）
        run: npx eslint src workers --quiet

      - name: 只跑 worker 侧单测
        run: npx vitest run workers/

  deploy:
    name: 部署到 Cloudflare
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 检查 Secrets 是否已配置（缺了直接给出可读报错）
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::缺少仓库 Secret CLOUDFLARE_API_TOKEN（Settings → Secrets and variables → Actions）"
            missing=1
          fi
          if [ -z "$CF_ACCOUNT" ]; then
            echo "::error::缺少仓库 Secret CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi
          exit $missing

      # 版本钉死成本地验证过的 4.158.0：wrangler 主版本升级会改打包/触发器行为，
      # ⛔ 别写成 @latest —— 那等于把线上部署交给「今天恰好发的新版本」。
      - name: 部署
        working-directory: workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # 2>&1 把 wrangler 的错误也收进日志；pipefail 让它的退出码透出给 job
          npx --yes wrangler@4.158.0 deploy --config wrangler-bidding-auto-fetch.toml 2>&1 | tee /tmp/deploy.log
          echo "---- 本次部署摘要 ----"
          grep -E "Current Version ID|Uploaded |Deployed |Total Upload" /tmp/deploy.log || true
          echo "---- 部署结果断言 ----"
          if ! grep -q "Current Version ID" /tmp/deploy.log; then
            echo "::error::wrangler 未打印 Current Version ID ⇒ 视为【未真正部署】，拒绝放行"
            exit 1
          fi
          echo "✅ wrangler 已确认部署出新的 Version ID"

      # 闸③：直接问 Cloudflare「线上现在是什么」。CI 绿了就必须能在线上脚本里
      #   找到本轮新增函数，且 cron 恰好是 toml 里那 4 条（期望值由 verify-deploy.mjs 直读 toml）。
      - name: 线上复核（脚本内容 + cron 条数）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node workers/verify-deploy.mjs

  bundle-artifact:
    name: 重建 _bundled 兜底产物（仅产出 artifact，不回写仓库）
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # _bundled 的用途只剩两个：① Dashboard 手动粘贴的基准 ② 部署前自检。
      # CI 里只产出 artifact 供下载，⛔ 不自动 commit 回仓库（避免部署流水线污染历史）。
      - name: 打包并自检（顶层重名必须 0 处）
        run: |
          set -euo pipefail
          node workers/_bundle.mjs | tee /tmp/bundle.log
          grep -q "顶层重名 0 处" /tmp/bundle.log
          echo "✅ 打包自检通过"

      - uses: actions/upload-artifact@v4
        with:
          name: worker-bundles
          path: workers/_bundled/*.js
          retention-days: 14
